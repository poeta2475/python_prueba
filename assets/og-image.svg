<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0b0f"/>
      <stop offset="100%" stop-color="#141025"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- grid -->
  <g stroke="#6366f1" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>
  <!-- brand row -->
  <text x="96" y="150" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#f1f5f9">🎮 Omar<tspan fill="#818cf8">Dev</tspan></text>
  <!-- headline -->
  <text x="96" y="330" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="#f1f5f9">Juegos &amp; proyectos</text>
  <text x="96" y="415" font-family="Inter, sans-serif" font-size="72" font-weight="900" fill="url(#grad)">hechos desde cero</text>
  <text x="96" y="490" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Portal personal de Omar · HTML, CSS y JS puro · Colombia 🇨🇴</text>
  <!-- decorative playing cards (blackjack nod) -->
  <g transform="translate(880,210) rotate(-12)">
    <rect width="150" height="210" rx="16" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="22" y="52" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#1a1a1a">A</text>
    <text x="60" y="135" font-family="Georgia, serif" font-size="72" fill="#1a1a1a" text-anchor="middle">♠</text>
  </g>
  <g transform="translate(990,235) rotate(8)">
    <rect width="150" height="210" rx="16" fill="url(#card)" stroke="#cbd5e1" stroke-width="2"/>
    <text x="22" y="52" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#dc2626">K</text>
    <text x="60" y="135" font-family="Georgia, serif" font-size="72" fill="#dc2626" text-anchor="middle">♥</text>
  </g>
</svg>
