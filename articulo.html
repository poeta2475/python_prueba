  <main id="main">
    <article class="article" id="article">
      <!-- Renderizado por JS -->
    </article>
  </main>

  <footer class="mini-footer">
    <p>© <span id="year">2025</span> NexaPy Analytics S.A.S. · Bogotá, Colombia · <a href="legal.html">Legal</a> · <a href="blog.html">Volver al blog</a></p>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/blog-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    (function () {
      var el = document.getElementById('article');
      if (!el || !window.NexaBlog) return;
      var slug = new URLSearchParams(location.search).get('post');
      var post = slug ? window.NexaBlog.bySlug(slug) : null;

      if (!post) {
        el.innerHTML =
          '<div class="article-head"><p class="page-breadcrumb"><a href="blog.html">← Blog</a></p>' +
          '<h1>Artículo no encontrado</h1>' +
          '<p class="article-lead">El artículo que buscas no existe o fue movido.</p>' +
          '<p><a href="blog.html" class="btn-primary btn-lg">Ver todos los artículos</a></p></div>';
        return;
      }

      document.title = post.title + ' | NexaPy Analytics';
      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', post.excerpt);

      // Artículos relacionados (otros 3 más recientes)
      var related = window.NexaBlog.all().filter(function (a) { return a.slug !== post.slug; }).slice(0, 3);
      var relatedHtml = related.map(function (a) {
        return '<a class="related-card" href="articulo.html?post=' + a.slug + '">' +
          '<span class="related-emoji">' + a.emoji + '</span>' +
          '<div><span class="r-tag">' + a.tag + '</span><h4>' + a.title + '</h4></div></a>';
      }).join('');

      el.innerHTML =
        '<div class="article-head">' +
        '<p class="page-breadcrumb"><a href="blog.html">← Blog</a> / ' + post.tag + '</p>' +
        '<span class="article-emoji">' + post.emoji + '</span>' +
        '<h1>' + post.title + '</h1>' +
        '<p class="article-lead">' + post.excerpt + '</p>' +
        '<div class="article-meta"><span>Por <strong>' + post.author + '</strong></span><span>·</span>' +
        '<span>' + window.NexaBlog.formatDate(post.date) + '</span><span>·</span>' +
        '<span>' + post.read + ' min de lectura</span></div>' +
        '</div>' +
        '<div class="article-body content-prose">' + post.body + '</div>' +
        '<div class="article-cta">' +
        '<h3>¿Te gustó este artículo?</h3>' +
        '<p>Empieza a aplicar estas ideas con NexaPy. 14 días gratis, sin tarjeta.</p>' +
        '<a href="signup.html" class="btn-primary btn-lg magnetic">Crear cuenta gratis</a>' +
        '</div>' +
        '<div class="article-related"><h3>Sigue leyendo</h3><div class="related-grid">' + relatedHtml + '</div></div>';
    })();
  </script>
</body>
</html>
